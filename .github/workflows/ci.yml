name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  rust:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --workspace --release
      - run: cargo test --workspace
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  swift:
    runs-on: macos-14
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build -p opennotch-ffi --release
      - run: mkdir -p apps/macos/Sources/Generated && cargo run -p opennotch-bindgen --bin uniffi-bindgen -- generate --library target/release/libopennotch_ffi.dylib --language swift --out-dir apps/macos/Sources/Generated
      - run: cd apps/macos && swift build -c release
